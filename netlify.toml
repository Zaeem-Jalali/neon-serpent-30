# Netlify deployment config.
#
# There is no build step: the repository root is the site. Vercel, Cloudflare
# Pages and GitHub Pages will all serve these files too — this file just adds
# the headers and cache rules that a static host does not set on its own.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------- headers ---

[[headers]]
  for = "/*"
  [headers.values]
    # The game loads no external scripts, styles, fonts or images, so the
    # policy can be tight: no 'unsafe-inline' anywhere, which is why the
    # service worker is registered from sw-register.js rather than inline.
    # img-src allows data: only so future inline SVG/data-URI art does not
    # require a policy change; nothing currently relies on it.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The service worker must always be revalidated, otherwise a stale copy can
# pin users to an old build indefinitely.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same for the shell: the service worker handles offline, not the HTTP cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons and the social card are content-stable and regenerated by
# tools/make-icons.js, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
